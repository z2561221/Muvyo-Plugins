name: Plugin Gate
"on":
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  plugin-release-gate:
    name: Plugin release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check PR source, versions and signed package layout
        env:
          PR_HEAD: ${{ github.head_ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: python .github/scripts/check_plugins.py --base "$PR_BASE" --branch "$PR_HEAD"
  plugin-test-gate:
    name: Plugin test gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/requirements.txt
      - run: python -m pip install -r .github/requirements.txt
      - name: Fetch pinned official Muvyo verifier
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/thsrite/muvyo-addon-guide/dbf96b5ce1aba87fe73440091b4d513b9ccc4fae/mv_addon.py \
            --output "$RUNNER_TEMP/mv_addon.py"
          echo "ae0187203f68fb2e97b9ebbaf3d7f19f4e879a5a9ef5841ef953aa52f7fbb4de  $RUNNER_TEMP/mv_addon.py" | sha256sum --check -
      - name: Verify repository signature and official signed packages
        env:
          MV_ADDON_VERIFIER: ${{ runner.temp }}/mv_addon.py
        run: python .github/scripts/check_plugins.py --verify
      - name: Test version, signature and withdrawal failures
        run: python -m unittest discover -s .github/tests -v
