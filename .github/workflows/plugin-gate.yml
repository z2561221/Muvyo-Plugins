name: Plugin Gate
"on":
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  plugin-release-gate:
    name: Plugin release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check branch, versions and signed package layout
        env:
          PR_HEAD: ${{ github.head_ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: python .github/scripts/check_plugins.py --base "$PR_BASE" --branch "$PR_HEAD"
  plugin-test-gate:
    name: Plugin test gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/requirements.txt
      - run: python -m pip install -r .github/requirements.txt
      - name: Verify repository signature and official signed packages
        run: python .github/scripts/check_plugins.py --verify
      - name: Test version, signature and immutable release failures
        run: python -m unittest discover -s tests -v
