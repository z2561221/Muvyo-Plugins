name: Plugin Release
"on":
  push:
    branches: [main]
    paths:
      - index.json
      - index.json.sig
      - 'plugins/**'
      - .github/plugin-catalog.json
      - .github/workflows/release.yml
      - .github/scripts/release_plugins.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: plugin-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/requirements.txt
      - run: python -m pip install -r .github/requirements.txt
      - name: Verify signed release input
        run: python .github/scripts/check_plugins.py --verify
      - name: Publish and read back immutable releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/release_plugins.py
